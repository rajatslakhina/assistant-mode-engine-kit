name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build + test (macOS, warnings as errors)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build from a clean checkout, warnings as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  ios:
    name: iOS Simulator build (AssistantModes + AssistantModesUI)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build both library targets for the iOS Simulator SDK
        run: >
          xcodebuild build
          -scheme AssistantModes-Package
          -destination 'generic/platform=iOS Simulator'
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

  foundation-models:
    name: Build with the Foundation Models SDK (compiles SystemModelBackend)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build, warnings as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Prove SystemModelBackend was compiled in (not skipped by canImport)
        run: |
          objects=$(find .build -name 'SystemModelBackend*.o')
          test "$(echo "$objects" | grep -c .)" -eq 1 || { echo "expected exactly one object file, got: $objects"; exit 1; }
          nm "$objects" | grep -q '18SystemModelBackendV'

  mutation:
    name: Mutation check (each guard must be caught by its test)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Apply each mutant, run its test, require a failure
        run: python3 Scripts/mutation_check.py
